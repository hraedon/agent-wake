name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install daemon
        run: pip install -e ".[dev]"
        working-directory: daemon
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: daemon

  python-claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent-wake-claude
        run: pip install -e ".[dev]"
        working-directory: adapters/claude
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: adapters/claude
      - name: Run fakechat end-to-end test
        run: python tools/fakechat-test.py
        working-directory: .
      - name: Verify installability
        run: pip install ./adapters/claude && python -c "import agent_wake_claude; print(agent_wake_claude.__version__)"

  # The opencode TypeScript adapter is archived in `adapters/opencode.archived/`
  # pending the agent-waked daemon rewrite. CI for it is intentionally disabled.
