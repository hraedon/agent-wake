name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-daemon:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install daemon
        run: pip install -e ".[dev,vault]"
        working-directory: daemon
      - name: Run mypy
        run: mypy src/
        working-directory: daemon
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: daemon

  python-claude:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install agent-wake-claude
        run: pip install -e ".[dev]"
        working-directory: adapters/claude
      - name: Run mypy
        run: mypy src/
        working-directory: adapters/claude
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: adapters/claude
      - name: Verify installability
        run: pip install ./adapters/claude && python -c "import agent_wake_claude; print(agent_wake_claude.__version__)"

  typescript-opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: adapters/opencode
      - name: Build
        run: bun run build
        working-directory: adapters/opencode
      - name: Run tests
        run: bun test
        working-directory: adapters/opencode

  identifier-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for work-domain identifiers
        run: |
          # Patterns that should not appear in public history.
          # Add patterns here as they are identified during publication scrub.
          PATTERNS=""
          if [ -n "$PATTERNS" ]; then
            if git log --all --oneline | grep -iE "$PATTERNS"; then
              echo "Work-domain identifiers found in history"
              exit 1
            fi
          fi
          echo "Identifier gate: clean (no patterns configured yet)"
