name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-daemon:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install daemon
        run: pip install -e ".[dev,vault]"
        working-directory: daemon
      - name: Run mypy
        run: mypy src/
        working-directory: daemon
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: daemon

  python-claude:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install agent-wake-claude
        run: pip install -e ".[dev]"
        working-directory: adapters/claude
      - name: Run mypy
        run: mypy src/
        working-directory: adapters/claude
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: adapters/claude
      - name: Verify installability
        run: pip install ./adapters/claude && python -c "import agent_wake_claude; print(agent_wake_claude.__version__)"

  typescript-opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: adapters/opencode
      - name: Build
        run: bun run build
        working-directory: adapters/opencode
      - name: Run tests
        run: bun test
        working-directory: adapters/opencode

  # Pre-publication gate (Plan 004 WI-4.2 / blueprint §3): fail if forbidden
  # work-domain / personal identifiers appear in tracked files. The denylist is
  # never committed — it comes from the AGENT_WAKE_FORBIDDEN_IDENTIFIERS
  # repository secret (borrowed from the gpo-lens gate pattern). The script exits
  # 0 when the secret is unset, so the gate is a no-op until it is configured.
  identifier-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for committed work-domain identifiers
        env:
          AGENT_WAKE_FORBIDDEN_IDENTIFIERS: ${{ secrets.AGENT_WAKE_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py

  # The lock is only a lock if something checks it. regista and agent-wake both
  # shipped a uv.lock that had silently stopped matching pyproject.toml — CI
  # installs unlocked, so nothing noticed until `uv run` failed on a clean
  # checkout. This job is the whole fix: it resolves, it does not install.
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Verify uv.lock agrees with pyproject.toml
        run: uv lock --check
        working-directory: daemon
