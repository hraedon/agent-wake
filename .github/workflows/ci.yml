name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-daemon:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install daemon
        # The conformance kit (agent-suite-conformance==1.1.0) is a normal pinned
        # PyPI dep of the [dev] extra. Its python_version >= '3.12' marker means
        # the 3.11 lane never installs it and the conformance gate skips there via
        # importorskip; the 3.12 lane runs the gate for real.
        run: pip install -e ".[dev,vault]"
        working-directory: daemon
      - name: Run mypy
        run: mypy src/
        working-directory: daemon
      - name: Run ruff
        run: ruff check .
        working-directory: daemon
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: daemon

  # CLI contract v1 conformance, built-wheel lane (docs/cli-contract.md §7). The
  # per-PR source lane above runs the gate against an editable checkout, where
  # pytest's ``pythonpath = ["src"]`` can shadow the installed package. This lane
  # proves the *published artifact* conforms: it builds the daemon wheel, installs
  # it with the pinned conformance kit into a clean >=3.12 venv, and runs the
  # conformance + meta-guard gates from a scratch dir that carries no pyproject/
  # src — so ``agent_waked`` resolves from site-packages, never the source tree.
  # >=3.12 because the conformance kit requires it.
  conformance-wheel:
    name: Conformance (built wheel, no source shadowing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout@v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build daemon wheel
        run: pip wheel --no-deps --wheel-dir /tmp/aw-dist .
        working-directory: daemon
      - name: Install built wheel + dev extras into a clean venv
        # Install the freshly built daemon wheel with its [dev] extra; the
        # conformance kit (agent-suite-conformance==1.1.0) and every other dep
        # come from PyPI. Resolve the wheel path so the step is not coupled to the
        # version string.
        run: |
          python -m venv /tmp/aw-venv
          wheel=$(ls /tmp/aw-dist/agent_waked-*.whl)
          /tmp/aw-venv/bin/pip install "${wheel}[dev]"
      - name: Prove no source shadowing
        run: /tmp/aw-venv/bin/python -c "import agent_waked, agent_suite.conformance as c; assert 'site-packages' in agent_waked.__file__, agent_waked.__file__; print('agent_waked:', agent_waked.__file__); print('kit:', c.KIT_VERSION, c.__file__)"
      - name: Run conformance + meta-guard gates against installed entry points
        # Copy ONLY the two gate files into a scratch tests/ dir (no pyproject, no
        # src) so there is no pythonpath shadowing; the CLI is invoked as
        # ``sys.executable -m agent_waked.cli`` and resolves from site-packages.
        run: |
          mkdir -p /tmp/aw-gate/tests
          cp daemon/tests/test_cli_conformance.py daemon/tests/test_conformance_meta_guard.py /tmp/aw-gate/tests/
          cd /tmp/aw-gate
          /tmp/aw-venv/bin/python -m pytest tests/ -v --tb=short -p no:cacheprovider

  python-claude:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install agent-wake-claude
        run: pip install -e ".[dev]"
        working-directory: adapters/claude
      - name: Run mypy
        run: mypy src/
        working-directory: adapters/claude
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: adapters/claude
      - name: Verify installability
        run: pip install ./adapters/claude && python -c "import agent_wake_claude; print(agent_wake_claude.__version__)"

  typescript-opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: adapters/opencode
      - name: Build
        run: bun run build
        working-directory: adapters/opencode
      - name: Run tests
        run: bun test
        working-directory: adapters/opencode

  # Pre-publication gate (Plan 004 WI-4.2 / blueprint §3): fail if forbidden
  # work-domain / personal identifiers appear in tracked files. The denylist is
  # never committed — it comes from the AGENT_WAKE_FORBIDDEN_IDENTIFIERS
  # repository secret (borrowed from the gpo-lens gate pattern). The script exits
  # 0 when the secret is unset, so the gate is a no-op until it is configured.
  identifier-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for committed work-domain identifiers
        env:
          AGENT_WAKE_FORBIDDEN_IDENTIFIERS: ${{ secrets.AGENT_WAKE_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py

  # The lock is only a lock if something checks it. regista and agent-wake both
  # shipped a uv.lock that had silently stopped matching pyproject.toml — CI
  # installs unlocked, so nothing noticed until `uv run` failed on a clean
  # checkout. This job is the whole fix: it resolves, it does not install.
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Verify uv.lock agrees with pyproject.toml
        run: uv lock --check
        working-directory: daemon
