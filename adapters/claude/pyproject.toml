[project]
name = "agent-wake-claude"
version = "0.0.1"
description = "Claude Code channel plugin for agent-wake external event signaling"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "agent-wake contributors"}
]
dependencies = []

[project.scripts]
agent-wake-claude = "agent_wake_claude.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
