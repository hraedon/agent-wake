[project]
name = "agent-waked"
version = "0.1.0"
description = "agent-wake daemon — central demultiplexer for wake events"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "agent-wake contributors"}
]
dependencies = [
    "aiohttp>=3.11,<3.12",
    "python-ulid~=3.0",
]

[project.scripts]
agent-waked = "agent_waked.main:main"
agent-wake = "agent_waked.cli:main"

[project.optional-dependencies]
vault = [
    "hvac>=2.0",
]
windows = [
    "pywin32>=306; platform_system == 'Windows'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    # CLI contract v1 conformance kit (Plan 018 WI-2 / Plan 019 B3 / WI-023). A
    # published wheel that requires py>=3.12, so it is installed only on the >=3.12
    # lanes (the daemon still supports 3.11 at runtime; the conformance test skips
    # there via importorskip). 1.1.0 adds the WI-026 meta-guard helper
    # ``assert_cases_declared`` used at module scope in test_cli_conformance.py.
    # Consumed only by tests/test_cli_conformance.py and
    # tests/test_conformance_meta_guard.py, never imported by runtime code.
    "agent-suite-conformance==1.1.0; python_version >= '3.12'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
